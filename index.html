<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>CCNA Soru Bankası</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:," />
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h1>CCNA Soru Bankası</h1>
    <p>Devam etmek için şifreyi gir.</p>
    <input type="password" id="lock-input" placeholder="Şifre" autocomplete="off" />
    <button id="lock-btn">Giriş</button>
    <p id="lock-error" class="hidden">Şifre yanlış.</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <span class="brand-title">CCNA Soru Bankası</span>
      <span class="brand-sub" id="brand-sub">314 soru</span>
    </div>
    <div class="jumpbox">
      <input type="number" id="jump-input" min="1" max="314" placeholder="# soru" />
      <button id="jump-btn">Git</button>
    </div>
  </header>

  <main id="list-root">
    <div class="loading">Yükleniyor…</div>
  </main>

  <button id="top-btn" title="Başa dön">↑</button>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close" type="button" title="Kapat">✕</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <footer>
    <p>Bu sayfa özel kullanım içindir, arama motorlarında listelenmez. Notların yalnızca bu tarayıcıda saklanır.</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
